.why-reasons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.why-reasons article{border-top:1px solid #354454;padding-top:17px}.why-reasons article>span{font:11px monospace;letter-spacing:1.2px;color:var(--gold)}.why-reasons h3{font-size:23px;margin:12px 0 10px}.why-reasons p{font-size:17px;line-height:1.5;color:var(--muted);margin:0}.why-close{font-size:19px;line-height:1.4;color:var(--blue);margin:27px 0 0}
@media(min-width:801px) and (max-height:850px){.layout-why_open h2{font-size:31px;margin-bottom:16px}.why-thesis{font-size:24px;margin-bottom:20px}.why-boundary{margin-bottom:21px}.why-middle{padding:17px 10px;gap:8px}.why-reasons h3{font-size:20px}.why-reasons p{font-size:15px}.why-close{font-size:17px;margin-top:21px}}
@media(max-width:800px){.why-boundary{grid-template-columns:1fr 16px 2fr 16px 1fr;gap:4px}.why-end{font-size:10px;letter-spacing:0}.why-middle b{font-size:11px}.why-middle>span{font-size:13px}.why-reasons{grid-template-columns:1fr;gap:17px}.why-thesis{font-size:24px}.why-close{font-size:17px}}

header .series{display:flex;align-items:center;gap:20px;letter-spacing:1.5px}header .presenter-name{font-size:11px;white-space:nowrap}header .event-brand{display:flex;align-items:center;flex-shrink:0}header img.aie-logo{display:block;width:176px;height:50px;object-fit:contain}header .series .version-tag{margin-left:0;flex-shrink:0}
@media(min-width:801px) and (max-height:850px){header img.aie-logo{width:156px;height:44px}}
@media(max-width:800px){header .series{gap:12px}header .presenter-name{display:none}header img.aie-logo{width:142px;height:40px}}

.header-brand{display:flex;align-items:center;gap:18px;min-width:0}.social-handle{font:13px monospace;white-space:nowrap;text-decoration:none;text-underline-offset:4px}.social-handle:hover,.speaker-social:hover{color:var(--gold);text-decoration:underline}.speaker-social{display:inline-block;font:16px monospace;margin:0 0 12px;text-decoration:none}
@media(max-width:800px){.header-brand{gap:12px}.social-handle{font-size:12px}.speaker-social{font-size:14px}}
@media(max-width:600px){header{gap:12px}.header-brand{gap:8px}header .header-brand .agentic-logo{width:80px;height:38px}.social-handle{font-size:11px}header img.aie-logo{width:112px;height:32px}header .series .version-tag{display:none}}
.demo-source-links{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:15px}.demo-source-links a{text-underline-offset:4px}

/* Attendee setup card: keep the title and bio intact, use the open right side. */
.hero{position:relative}.workshop-qr{position:absolute;right:0;bottom:25px;width:236px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;text-decoration:none}.workshop-qr .qr-kicker{font:12px monospace;letter-spacing:2px;color:var(--gold);margin-bottom:4px}.workshop-qr img{width:220px;height:220px;background:#fff;border-radius:8px;padding:0}.workshop-qr strong{font-size:20px;color:var(--text);margin-top:4px}.workshop-qr span:not(.qr-kicker){font-size:15px;color:var(--muted)}.workshop-qr small{font-size:12px;color:var(--blue);margin-top:2px}
@media(min-width:801px) and (max-height:850px){.workshop-qr{bottom:10px;width:216px;gap:8px}.workshop-qr img{width:200px;height:200px}.workshop-qr strong{font-size:18px}.workshop-qr .qr-kicker{font-size:11px;letter-spacing:1.5px}.workshop-qr span:not(.qr-kicker){font-size:14px}}
@media(min-width:801px) and (max-width:1100px){.workshop-qr{width:184px}.workshop-qr img{width:176px;height:176px}.speaker{padding-right:190px}.speaker-roles{font-size:14px}.hero h1{font-size:clamp(44px,5.4vw,80px)}}
@media(max-width:800px){.workshop-qr{position:static;width:100%;margin-top:28px;order:2}.workshop-qr img{width:220px;height:220px}.hero{display:flex;flex-direction:column}.hero .workshop-qr~*{order:0}}


#api-example[hidden],#api-benchmark[hidden]{display:none}.benchmark-headline{font-size:32px;font-weight:bold;letter-spacing:-1px;margin:14px 0 5px}.benchmark-subtitle{font:13px monospace;color:var(--muted);margin:0}.benchmark-chart{display:block;width:min(1120px,100%);height:auto;max-height:42vh;object-fit:contain;margin:4px auto}.benchmark-result{display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-top:1px solid var(--border);padding-top:14px}.benchmark-result strong{font-size:25px;color:var(--gold)}.benchmark-result span{font:15px monospace;color:var(--muted)}.benchmark-links{font-size:13px;margin:12px 0}.layout-thank_you .thank-title{max-width:none;margin-bottom:32px}.thank-title span{display:block}.thank-title .thanks{font-size:clamp(58px,7vw,96px);line-height:1.04;white-space:nowrap;letter-spacing:-.045em;margin-bottom:16px}.thank-title .thank-invite{font-size:clamp(26px,3.05vw,48px);line-height:1.2;color:var(--blue);letter-spacing:-.025em;white-space:nowrap}.thank-grid .thank-cta{font-size:clamp(22px,2.25vw,34px);line-height:1.3;color:var(--gold);font-weight:600;margin-top:30px;letter-spacing:-.02em}.thank-cta span{display:block;margin-top:6px;color:var(--text)}
@media(min-width:801px) and (max-height:850px){.benchmark-headline{font-size:27px;margin-top:8px}.benchmark-chart{max-height:36vh}.benchmark-result{padding-top:9px}.benchmark-result strong{font-size:21px}.benchmark-result span{font-size:12px}.benchmark-links{font-size:12px;margin:9px 0}.layout-thank_you .thank-title{margin-bottom:20px}.thank-title .thanks{font-size:64px;margin-bottom:12px}.thank-grid .thank-cta{font-size:25px;margin-top:22px}.thank-grid p{font-size:20px}.thank-grid a{font-size:22px;margin:17px 0}}
@media(max-width:800px){.thank-title .thank-invite{white-space:normal}.benchmark-chart{max-height:none}.benchmark-result{align-items:flex-start;flex-direction:column;gap:9px}.thank-grid .thank-cta{font-size:26px}}


.freedom-statement{padding:4vh 0}.freedom-statement h2{font-size:clamp(24px,6.8vw,116px);line-height:1.04;letter-spacing:-.055em;margin:0;max-width:none;white-space:nowrap}.freedom-statement h2 span{color:var(--blue)}.freedom-statement::after{content:"";display:block;width:clamp(70px,9vw,150px);height:6px;background:var(--gold);margin-top:36px;border-radius:3px}

#slide>.freedom-flag{animation:none}.layout-freedom{position:relative;isolation:isolate;overflow:hidden}.freedom-flag{position:absolute;inset:0;z-index:-1;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.17;mask-image:linear-gradient(90deg,transparent,#000 14%,#000 84%,transparent)}.freedom-flag canvas{display:block;width:98%;height:100%;object-fit:contain}.freedom-statement{position:relative;text-shadow:0 3px 28px #0009}.freedom-statement h2 span{text-shadow:0 3px 30px #030303aa}

<script id="deck-data" type="application/json">{"slides": [{"title": "Keep the Harness, Own Your Inference", "start": 0, "end": 0.5, "layout": "title", "text": ["Inside the agentic server", "Francisco Javier Arceo", "AI Engineer CODE / 60-minute workshop"], "notes": "Start with the experience the audience already knows: 'You open Codex, ask it to fix a bug, and it does. What happened between that prompt and the patch?' Keep the opening about Codex; do not begin with an open-engine pitch, implementation product names or a feature list. Move to slide 2 for the opening thesis after a brief introduction. The role links remain as speaker credentials, not an architecture lesson. The title-slide flow is request → Codex → working code. The generic API/model/client loop comes next; our implementation and serving-engine choices enter once the audience understands the problem. Attendees do not need to install anything or bring a GPU. Speaker bio also includes Maintainer — Llama Stack (now OGX), linked to https://github.com/ogx-ai/ogx, alongside the existing Baseten, vLLM Agentic API, Feast, and Kubeflow roles.", "command": "", "cue": "Start immediately; title gets 30 seconds.", "sources": ["proposal"], "original_slide": 1}, {"title": "Open source is freedom", "start": 0.5, "end": 1, "layout": "freedom", "text": [], "notes": "Open source is freedom: the freedom to understand the system, change it, and decide how it runs. Pause on the statement, then start with the familiar Codex experience. We will open the machinery between the harness and inference throughout the workshop.", "command": "", "cue": "Let the statement land. Then: you ask Codex to fix a bug. It does. How?", "sources": [], "original_slide": null}, {"title": "You ask Codex to fix a bug.\nIt does. How?", "start": 1, "end": 2.5, "layout": "motivation", "text": [], "notes": "Start only with the familiar Codex experience. Do not introduce vLLM, SGLang, Agentic API, or an alternative backend in this opening. Credentials on the title slide remain, but its visible flow is now request → Codex → working code. Slide 3 starts with a user asking Codex to fix a bug; only after advancing do we open the generic OpenAI API flow. Use ] to advance and [ to go back. The six steps are: familiar experience; instructions + task + tool definitions + initial environment/repo facts; model-generated tool call returned through the API; Codex executing repository inspection tools; tool outputs added to the next model input; optional retained conversation history and reusable cached prompt computation. The model emits a requested action; the API delivers it; Codex executes client tools. Repository content discovered by search/read tools becomes context after their outputs return, rather than being assumed to exist in the initial prompt. Some facts and instructions may already be supplied at startup, so do not claim absolutely no repository information is present initially. The example collapses multiple search/read calls into the repository-inspection step; each normally participates in further inference rounds. Tool choices can include editing and test execution, followed by more model calls. The OpenAI API label is a schematic public-contract model, not a diagram of undisclosed internal deployment. Explicitly separate optional stored Responses/conversation items from cached inference computation: storing history is a continuation mechanism, while an eligible prompt-cache hit can skip repeated processing. Codex can instead replay full history with store:false, so do not assert that every Codex request uses previous_response_id or durable API storage. Caching still produces a newly generated output. Keep this opening at the user/client/API/model level; the open implementation is introduced after the audience understands these roles.", "command": "", "cue": "Start with Codex only. ] reveals input → model-generated call → client execution → returned context → next round → state/cache.", "sources": ["openai_function_flow", "openai_history", "openai_prompt_cache"], "original_slide": 2}, {"title": "But first: why open the machinery?", "start": 2.5, "end": 3, "layout": "why_open", "text": ["The layer is opaque today.", "It’s where agent research is heading.", "Trace the work", "Enforce the limits", "Change the machinery", "Understand the future"], "notes": "Adapted from Francisco’s latest The Rise of the Agentic Server draft, found in the chat Draft AIE talk article pitch and read from its current Google Doc on November 9. Pause after the familiar Codex loop. We return to code we did not write and decisions we did not make. As more work happens remotely or continues without our attention, we need to reconstruct consequential actions, understand what context and tools were used, enforce access and resource limits, investigate failures, and change the implementation. An interface or model weights alone do not reveal the surrounding system’s behavior. An open implementation makes that layer available to inspection and experiments; it does not guarantee deterministic reproduction, safety, or lower cost. Record versions, inputs, tool outputs and state, while recognizing sampling and changing external services. Keep this slide about the reason for the workshop, without introducing engine brands or enumerating API features. Do not repeat the article’s incident or swarm-scale claims here. Transition: Start with the harness web-search recordings, then open up what happens between the client and inference. Save the detailed coding-task setup until immediately before the full trace. Also make the forward-looking motivation explicit: we must understand the future of agents, not only explain today’s tool loop. Inspecting and experimenting with this layer lets us study coordination, shared context and continued work, and help shape what comes next. These are directions to investigate, not a claim that the future is settled. Lead with Francisco’s thesis: this layer is opaque today, yet it is where agent research is heading. The motivation is prospective as well as operational: opening the implementation gives researchers a system they can inspect, modify, and use to test ideas in coordination, memory, and execution. Present this as the talk’s research direction, not a claim that all agent research occurs here.", "command": "", "cue": "30-second motivation: understand what happened, control the limits, and change the system. Then continue to the bug-fix demo.", "sources": ["agentic_essay"], "original_slide": null}, {"title": "Two harnesses. The server searches.", "start": 3, "end": 9, "layout": "recorded_demos", "text": ["From memory", "Gateway-executed web search", "Answer with sources"], "notes": "Both tabs play fresh local runs recorded on 2026-11-05 using NVIDIA Nemotron 3.5 Bolt E4B BF16, official Hugging Face revision 49843eed8db1f1c616c47af75cfd36e07aec0667. Inference runs through local vLLM on DGX Spark, Agentic API, and real You.com search. Codex CLI version 0.160.0; Claude Code version 2.1.317. Both use the same two prompts: ask about GPT-5.6 from memory without tools, then ask for web search. The second prompt resumes the same harness session. Claude uses an isolated canonical model override to the NVIDIA model; automatic memory is disabled and only WebSearch is advertised. The gateway owns WebSearch through its configured alias.\nThe left panel shows real search execution: query, HTTP status, and source titles/URLs from a localhost proxy forwarding to https://ydc-index.io. The right panel renders actual CLI output. These are rendered event captures, not desktop screen captures; timing is edited for readability and startup diagnostics/duplicate final stdout are omitted. Raw event captures and configuration provenance are in captures/. No credentials are captured. Generated factual claims are model output, not verified workshop facts. Discuss source quality alongside successful execution. Use fullscreen for readability. This is web-search footage. The native Codex bug-fix trace has its own setup immediately before its later recording. The earlier Red Hat Claude footage and Loom Codex fallback are superseded. Leaving the slide or switching harnesses pauses playback.", "command": "", "cue": "Play, then open the mechanics. Stop at minute 10.", "sources": ["harness"], "original_slide": 5}, {"title": "The agent loop spans two runtimes.", "start": 9, "end": 11, "layout": "execution_split", "text": [], "notes": "Recall the generic Codex/OpenAI API story from slide 3 before mapping those roles onto our implementation. The client constructs input and executes local tools; model-generated requests arrive through the API; tool outputs supply repository context for subsequent inference rounds. Now introduce the agentic-server boundary as the implementation we can inspect.  First, the coding harness can run on a remote machine rather than your laptop. Codex Cloud is an example of that deployment shift. Second, the API behind a harness can itself manage state, execute built-in tools, and prepare context across inference rounds. A remote harness still has a workspace and execution permissions. The gateway has a different role. Do not draw all remote execution inside one box or claim that moving a CLI into a container implements an agentic API. This workshop demonstrates open harness clients against our gateway; it does not claim that OpenAI-managed Codex Cloud can be configured to use this gateway. Our remote-harness diagram is a self-managed deployment pattern.", "command": "", "cue": "Ask: where does the shell command run?", "sources": ["cloud", "harness", "mcp"], "original_slide": 6}, {"title": "Follow one turn through the stack.", "start": 11, "end": 13, "layout": "stack", "text": ["Harness", "vLLM Agentic API", "Inference engine", "State + tools"], "notes": "The map labels the harness as Codex. Skills API and Containers API are conceptual resources, not a claim of project implementation parity or a claim that Codex automatically calls every endpoint. Skills supply reusable instruction and file bundles to an execution environment; container files can be uploaded directly or added from a Files API file_id. Shell uses the selected runtime. Trace the arrows in order. The harness sends an input and tool declarations. The gateway resolves stored state, prepares the inference request, and receives typed output. If the model asks for a function tool that the client executes, the function call returns to the harness; the harness sends a function call output on the next request. If it selects an available gateway-executed built-in tool, the gateway can execute it and start another inference round before completing the response. Storage persists the items required for continuation. Emphasize the vocabulary: a turn may contain multiple inference rounds, and a response may contain messages, function calls, reasoning items, and other output items. A response is not just a string.", "command": "", "cue": "Keep the architecture visible when answering questions.", "sources": ["mcp", "tools", "skills_create", "container_files", "skills_api", "shell_api"], "original_slide": 7}, {"title": "The API is becoming the runtime.", "start": 13, "end": 15, "layout": "runtime_shift", "text": ["EXECUTE\nWeb search · file search\nTools run inside the API request", "MANAGE CONTEXT\nHistory · compaction\nPrepare the next inference round", "BUILD KNOWLEDGE\nParse → chunk → embed → index\nStorage and retrieval behind the API"], "notes": "More of the work once assembled in each client is moving behind the API: executing tools, reconstructing history, compacting context, and preparing searchable knowledge. OpenAI Responses illustrates the shift with built-in web/file search and server-side compaction; its vector stores automatically chunk, embed, and index uploaded files. Anthropic illustrates the same direction with server-executed web search, server-side compaction, and Messages threads. These are examples of a shared architectural direction, not identical feature sets.\nMemory deserves its own boundary: long-term memory stores selected knowledge across sessions; compaction reduces active context; retrieval finds relevant content. Anthropic's Messages memory tool is explicitly client-executed: the application implements file operations and controls storage. That application can itself run on a server, but this is not Anthropic-hosted memory. Do not claim that Anthropic's Files API is equivalent to OpenAI vector stores or that both vendors supply every capability listed. Chunking and embedding are retrieval infrastructure, not necessarily tools the model calls directly.\nA tool declaration still is not execution. A shell tool can run in a local harness or a remote harness container; a built-in search can run in the agentic server; the inference engine generates model output. Ask: who executes, who stores, and who supplies the next context? These are precisely the boundaries Agentic API lets us inspect and control on open infrastructure.", "command": "", "cue": "The API now owns more of the work between model calls.", "sources": ["responses_migration", "file_search", "openai_retrieval", "openai_compact", "anthropic_search", "anthropic_compact", "anthropic_memory"], "original_slide": 8}, {"title": "A response is a stream of typed work.", "start": 15, "end": 16, "layout": "api_walk", "text": ["message", "function call", "function call output", "reasoning / compaction"], "notes": "'When we say history, we mean item history. A flattened transcript can lose the association between a function call and its output, or drop state the next inference round expects.' Show the schematic call_id connection. Explain that streaming events incrementally build output items; a text delta is not a completed response. We will not turn this into a streaming-protocol lecture. The relevant consequence is that the server must preserve the meaning of the interaction across turns, even when it changes the upstream representation. The diagram is schematic and contains no captured IDs or benchmark data.", "command": "", "cue": "Transition: now close the client and continue.", "sources": ["mcp", "compact"], "original_slide": 9, "steps": [{"label": "Response", "body": "This is a custom function call, not built-in file_search. The model requests work; the client has not executed it yet.", "code": "{\n  \"id\": \"resp_demo_01\", \"object\": \"response\",\n  \"output\": [\n    { \"type\": \"message\", \"role\": \"assistant\",\n      \"content\": [{ \"type\": \"output_text\",\n        \"text\": \"I will read the retry policy.\" }] },\n    { \"type\": \"function_call\", \"call_id\": \"call_policy_01\",\n      \"name\": \"search_policy\",\n      \"arguments\": \"{\\\"query\\\":\\\"retry cap\\\"}\" }\n  ]\n}"}, {"label": "Tool output", "body": "The executor sends the result back as input, linked by call_id.", "code": "{\n  \"model\": \"served-model\",\n  \"previous_response_id\": \"resp_demo_01\",\n  \"input\": [\n    {\n      \"type\": \"function_call_output\",\n      \"call_id\": \"call_policy_01\",\n      \"output\": \"{\\\"source\\\":\\\"retry-policy-v3\\\",\\\"cap_seconds\\\":12}\"\n    }\n  ]\n}"}, {"label": "Compaction", "body": "A separate compact response returns a continuation window. Keep the entire output array.", "code": "{\n  \"object\": \"response.compaction\",\n  \"output\": [\n    { \"type\": \"message\", \"role\": \"user\",\n      \"content\": [{ \"type\": \"input_text\",\n        \"text\": \"Fix retry_delay; do not edit tests.\" }] },\n    { \"id\": \"cmp_01\", \"type\": \"compaction\",\n      \"encrypted_content\": \"<checkpoint payload>\" }\n  ]\n}"}], "scope": "Illustrative JSON with mock IDs and selected fields. Function output is next-request input; compaction is a separate response. Local checkpoint encoding differs from OpenAI hosted encoding."}, {"title": "One tool call. Two inference rounds.", "start": 16, "end": 18, "layout": "loop_trace", "text": ["Request 1\nconstraints + work item", "Stored response\nordered item history", "Request 2\nprevious_response_id + new input"], "notes": "Walk the six interactive stages on this slide: hydrate, generate, assemble, execute, return, continue. All payloads and terminal output are authored illustrations, not a recorded model run. The tool name run_shell is a representative client-executed function, not a promise about Codex's exact schema. Token fragments are illustrative decoded pieces, not real tokenizer boundaries or SSE frames. Explain that a configured model/template and parser determine the tool-call representation; ordinary text mentioning a command is not enough to execute it. Codex executes the command after its own approval and sandbox checks. The call_id joins the function call to its output; previous_response_id locates prior item history. Round two consumes the actual output and can generate another tool call or a final message. 'A model does not retain this conversation in its weights between requests. Something has to supply the relevant context again.' Distinguish the saved response, the client session, and the engine's cache. In this demo we use explicit store:true and previous_response_id. The gateway retrieves the prior items and constructs the next model-facing request. A conversation object is another state-management interface; we are using a response chain so the mechanism fits on screen. Do not claim that a gateway restart is safe unless the actual deployment uses durable storage and has been tested. We demonstrate a new client request, not a storage-failover test. Ask the audience whether a fresh request without any ID or history should know the earlier work item.", "command": "", "cue": "Prediction: will the control request know DEMO-742?", "sources": ["harness", "dynamo"], "original_slide": 10}, {"title": "Same task. New request. One response ID.", "start": 18, "end": 22, "layout": "api_walk", "text": ["DEMO 2 / Conversation state", "Pass an ID, not the entire earlier input", "Compare with a fresh request"], "notes": "Walk through the visible Python calls in one session. Use first.id directly in the continuation request; resp_demo_01 is only an illustrative printed ID. Compare with a fresh request lacking previous_response_id: it has no grounded source for the Jira ticket or constraints. This is a teaching example, not a captured model result.", "command": "", "cue": "Finish by 23:00; no live storage debugging.", "sources": ["dynamo"], "original_slide": 11, "steps": [{"label": "1. Connect", "body": "Use the OpenAI Python client against your Agentic API server. The next two tabs run in this same Python session.", "code": "import os\nfrom openai import OpenAI\n\nclient = OpenAI(\n    base_url=\"http://localhost:9000/v1\",\n    api_key=os.environ[\"AGENTIC_GATEWAY_API_KEY\"],\n)\nmodel = os.environ[\"AIE_MODEL\"]"}, {"label": "2. Save the task", "body": "Introduce the fictional Jira ticket and its constraints. Keep the response object returned by the server.", "code": "first = client.responses.create(\n    model=model,\n    store=True,\n    input=(\n        \"Jira ticket DEMO-742: fix retry_delay. \"\n        \"No new dependencies. Do not edit tests.\"\n    ),\n)\nprint(first.id)\n# Example: resp_demo_01 (your server returns the real ID)"}, {"label": "3. Continue", "body": "The second request carries the ID, not a copy of the earlier conversation. The server restores the ticket and constraints.", "code": "continued = client.responses.create(\n    model=model,\n    previous_response_id=first.id,\n    input=\"Which Jira ticket and constraints are we working on?\",\n    store=True,\n)\nprint(continued.output_text)\n# Check: DEMO-742; no new dependencies; do not edit tests."}], "scope": "Python SDK example · fictional Jira ticket DEMO-742 · configure AIE_MODEL and your gateway API key before presenting."}, {"title": "State is an input to inference.", "start": 22, "end": 24, "layout": "columns", "text": ["PERSISTENCE\nWhich items were saved?", "REHYDRATION\nWhich items reach this round?", "CACHE\nWhich computation can be reused?"], "notes": "'These are three different questions. Saving an item does not mean it belongs in every later model call. Reconstructing the context does not mean the engine has a warm KV cache. A cache hit can improve execution, but it is not the durable source of truth for the conversation.' Connect this to cross-engine support without returning to worker-routing internals. The gateway lets the application continue from meaningful state while the serving stack handles model execution. In the Dynamo configuration documented by the project, the gateway reconstructs history because the upstream endpoint does not accept previous_response_id directly. Frame that as evidence from a pinned integration, not a permanent statement about all Dynamo versions. The next problem is finding information that was never in the conversation.", "command": "", "cue": "Transition: knowing the task is not knowing the policy.", "sources": ["dynamo", "llmd"], "original_slide": 12}, {"title": "Two API contracts. One agentic server.", "start": 24, "end": 25, "layout": "protocol_bridge", "text": ["OPENAI\nChat Completions → Responses\nBuilt-in tools · state · compaction", "ANTHROPIC\nMessages + server tools + threads\nSearch · compaction · history", "AGENTIC API\nOpen infrastructure for both\nThreads targeted for this talk"], "notes": "Start with the cross-provider progression: OpenAI moved from the Chat Completions interface to Responses, which combines response continuation and built-in tools. Chat Completions remains available; this is an architectural progression, not a claim of deprecation. Anthropic is extending the Messages API itself with threads, not replacing it with a separate API. Anthropic announced Message threads in public beta on November 2, 2026. This is another concrete example of the shift: clients send the full history once, then only new messages and the previous response's message ID. The API reconstructs context before inference. Use the example on screen to connect directly to the hydration walkthrough. The beta header is message-threads-2026-08-12; its date is not the public announcement date. Anthropic threads expire after five minutes of inactivity and are best-effort, so the client remains the source of truth and needs a full-history replay path. Smaller requests do not mean the model sees less context or that token usage drops. This feature moves history handling; it does not by itself move shell execution or the entire harness to the server. Our broader argument combines this with the state, compaction, and execution examples elsewhere in the talk. Agentic API support is targeted for the talk per Francisco: the November 4 local working tree already contains Messages thread handling and docs, but these uncommitted changes were only inspected, not tested or released as part of this presentation update. Its documented database-backed storage is distinct from Anthropic's in-memory service. Verify the final revision and rehearse create/continue before changing the slide's status to available.", "command": "", "cue": "One minute: concrete API change, then back to state versus retrieval.", "sources": ["responses_migration", "anthropic_threads", "threads_announcement"], "original_slide": 13}, {"title": "Memory is a system, not a single feature.", "start": 25, "end": 26, "layout": "columns", "text": ["CONVERSATION STATE\nTask history and prior tool results", "RETRIEVAL\nFetch relevant knowledge from sources", "COMPACTION\nCarry essential context into the next round"], "notes": "Use the retry task to make each distinction concrete. Conversation state carries our work item, the instructions, and prior tool call outputs. Retrieval finds the authoritative retry policy. Compaction reduces the active history while preserving enough to continue. Calling all three 'memory' hides different engineering jobs. Retrieval-augmented generation means putting retrieved evidence into the model's context; the retrieval implementation may use keyword search, embeddings, or both. Our tiny corpus is deliberately deterministic so the audience can inspect it. It is not a vector-search benchmark or an automatic long-term memory subsystem. Ask: if the retry cap changes tomorrow, which layer should fetch the updated value? Retrieval, with source identity and freshness checks.", "command": "", "cue": "Give the audience the three questions, not three product names.", "sources": ["file_search", "compact"], "original_slide": 14}, {"title": "Can the model know our retry policy?", "start": 26, "end": 27, "layout": "question", "text": ["The policy is outside the model.", "Before answering: retrieve it.", "After answering: check the source."], "notes": "Say: 'I can ask for a reasonable retry cap and get a plausible answer. That is different from asking for our retry cap.' The workshop-specific answer is 12 seconds. It was established by our fixture policy, not by model pretraining. Ask attendees to predict what evidence they would demand before accepting the answer: a tool call, a returned source, and the content actually supplied to the next inference round. Open policy.txt briefly to establish the source identity retry-policy-v3. In a real application, access control and freshness belong to the retrieval service. Now show built-in file_search: the server retrieves the policy and continues inference.", "command": "", "cue": "Ask for evidence, not confidence.", "sources": [], "original_slide": 15}, {"title": "File search runs inside the server.", "start": 27, "end": 29.5, "layout": "api_walk", "text": ["file_search + vector_store_ids", "Server retrieves and continues inference", "Answer includes file citations"], "notes": "This is now a real local SDK demo, recorded November 8. The file-search development branch at 45c729f plus the isolated startup registration fix uploads three public PDFs, parses and chunks them, runs native built-in file_search, emits file_search_call output and file_citation annotations, and persists the response. The first two steps show the executed SDK pattern; the last two show selected real response fields. Retrieval in this run is keyword based; no embedding endpoint was configured. The development build uses file-search-pdf and is separate from the older main checkout. Seven focused tests pass, including a regression for startup registration. After the short coding-task setup, the recording slide offers the PDF wire trace in its second tab. Citations establish file identity and a text anchor; inspect supporting passages to establish factual support. The fifth tab shows the separate November 3 BEIR semantic-retrieval repository benchmark: nDCG@10 0.310050 NFCorpus, 0.696806 SciFact, 0.392804 ArguAna. The exact-cosine reference uses the same embedding arrays; all three scores round equally at three decimals. All 2,029 judged queries returned rankings. This does not measure HTTP ingestion, generation, citations, latency, or live-provider parity. It is distinct from the keyword-based PDF recording. Saved rankings were rescored with pytrec_eval before adding this chart; exact source/model revisions were not retained in the run reports.", "command": "", "cue": "Trace request → server search → cited answer. No client function_call_output.", "sources": ["file_search", "retrieval_benchmark"], "original_slide": 16, "steps": [{"label": "1. Upload + index", "body": "Three public research PDFs: elastic net, glmnet, and strong rules. Agentic API parses, chunks, and indexes the uploaded files.", "code": "from openai import OpenAI\n\nclient = OpenAI(base_url=\"http://localhost:9001/v1\",\n                api_key=\"local-demo\")\nstore = client.vector_stores.create(name=\"Workshop papers\")\nfor path in pdf_paths:\n    with open(path, \"rb\") as pdf:\n        file = client.files.create(file=pdf, purpose=\"assistants\")\n    client.vector_stores.files.create_and_poll(\n        vector_store_id=store.id, file_id=file.id\n    )"}, {"label": "2. Request file search", "body": "The native built-in tool runs in Agentic API. The client sends one Responses request; the server handles retrieval and further inference rounds.", "code": "response = client.responses.create(\n    model=model,\n    input=\"Search the papers: why does elastic net group predictors?\",\n    tools=[{\n        \"type\": \"file_search\",\n        \"vector_store_ids\": [store.id],\n        \"max_num_results\": 5,\n    }],\n    include=[\"file_search_call.results\"],\n    stream=True,\n)"}, {"label": "3. Inspect retrieved files", "body": "Selected fields from the real November 8 capture. The full results also contain retrieved passage text; the next slide shows it arriving at the model.", "code": "{\n  \"type\": \"file_search_call\",\n  \"id\": \"fs_a36227b9ffd01095\",\n  \"status\": \"completed\",\n  \"queries\": [\n    \"elastic net selects correlated predictors together group effect\",\n    \"glmnet regularization path coordinate descent warm starts\",\n    \"strong rules screening KKT conditions check\"\n  ],\n  \"results\": [\n    {\n      \"file_id\": \"file-01a1bbc7-d272-7851-a045-bc953cc33840\",\n      \"filename\": \"glmnet.pdf\",\n      \"score\": 0.9385977831593424\n    }\n  ]\n}"}, {"label": "4. Inspect citations", "body": "Actual output_text annotations from the recorded response. File IDs match uploaded PDFs; index points into the complete original answer. Check the passage against the claim.", "code": "{\n  \"annotations\": [\n    {\n      \"file_id\": \"file-01a1bbc7-d272-7851-a045-bc953cc33840\",\n      \"filename\": \"glmnet.pdf\",\n      \"index\": 336,\n      \"type\": \"file_citation\"\n    },\n    {\n      \"file_id\": \"file-01a1bbc7-d272-7851-a045-bc953cc33840\",\n      \"filename\": \"glmnet.pdf\",\n      \"index\": 655,\n      \"type\": \"file_citation\"\n    },\n    {\n      \"file_id\": \"file-01a1bbc7-d28a-7c10-af1e-241d70fe1a9d\",\n      \"filename\": \"strong-rules.pdf\",\n      \"index\": 967,\n      \"type\": \"file_citation\"\n    }\n  ]\n}"}, {"label": "5. Retrieval benchmark", "body": "BEIR retrieval quality: the sqlite-vec implementation matches the exact-cosine reference to three decimals on these datasets.", "code": "", "kind": "retrieval_benchmark"}], "scope": "LOCAL RUN VERIFIED · 2026-11-08 · development build + startup fix · PDF ingestion + keyword retrieval · actual output excerpts"}, {"title": "Demo setup: one bug, three views.", "start": 29.5, "end": 30.5, "layout": "task_setup", "text": ["CODEX CLIENT\nRead penalty.py. Reproduce failures. Edit the code. Rerun the tests.", "AGENTIC SERVER\nFollow requests, tool-call items, and returned tool outputs.", "vLLM INFERENCE\nWatch generated token pieces and streamed tool-call arguments."], "notes": "Place this setup immediately before the full-trace recording, after explaining state, tools, and file search. This is the real elastic-net task in the native Codex terminal recording, not the separate retry-policy teaching fixture used in API examples. The L1 and L2 mixing weights are swapped in penalty.py. Codex reproduces three failing tests, fixes the implementation, and reruns the same tests successfully; independent execution yields 0.6475 for the recorded mixed-penalty case. Do not reveal the patch yet. Orient the audience to the three synchronized views: native Codex client, Agentic API server wire, and vLLM inference events. Distinguish decoded token pieces from streamed tool-call argument fragments. The model requests a client tool, Codex executes it, and its output feeds another inference round. On the next slide, press P to start; V expands. The second tab is a separate SDK PDF upload/file-search trace, already introduced on the preceding file-search slide.", "command": "", "cue": "Orient the three panes, state the task, then advance directly to the recording. P starts playback; V expands.", "sources": [], "original_slide": 4}, {"title": "Watch the whole turn.", "start": 30.5, "end": 34, "layout": "trace_recordings", "text": ["Declared tool", "Executed call", "Source returned", "Grounded answer"], "notes": "The first tab now replays the actual interactive Codex 0.160.0 terminal UI recorded in a real PTY, not codex exec --json and not a reconstructed transcript. It shows the user prompt, native working indicators, executed commands, failing tests, code repair, passing tests and the final answer. Codex fixed the swapped elastic-net weights, all 3 tests pass, tests were unchanged, and independent execution reproduced 0.6475. The xterm.js player replays exact recorded terminal bytes beside timestamp-synchronized server and vLLM events. The opening idle is shortened to 3 seconds; the remaining recorded sequence runs at the selectable playback speed (default 0.75x). P starts/pauses, V expands, the timeline seeks, and the native terminal scrollback remains available. This is a recording, not a browser shell connected to a live machine. Seven agent-loop requests and one background title-generation request were recorded; the title request remains in the wire captures but is excluded from the main panes. Actual vLLM logprob token pieces and separately labeled tool-argument fragments remain visible. Codex uses store:false with full-history replay. The same documented compatibility tap omits optional newer fco_ output-item IDs and preserves call_id; the inference tap requests logprobs and disables thinking. Public request captures omit base instructions, the installed skill catalog, local environment context and client metadata. The PDF tab remains a separate OpenAI Python SDK recording of three PDF uploads, keyword retrieval, native file_search, and citations. The previous event-log video is retained as an older asset but is not the Codex demo shown on this slide.", "command": "", "cue": "Play the native terminal. Pause at the failing tests, then at function_call_output: the model consumes what Codex actually executed.", "sources": [], "original_slide": 17}, {"title": "What happens when the context fills up?", "start": 34, "end": 36, "layout": "context_curve", "text": ["Long item history", "Compaction inference", "Canonical compacted window", "Next inference round"], "notes": "Explain that long tasks accumulate files, logs, tool call outputs, and intermediate plans. The next round has a finite context budget. Compaction spends an inference call to produce a smaller continuation window. Truncation simply discards content; summarization introduces its own risk of losing constraints or provenance. In vLLM Agentic API, the standalone compact endpoint returns retained user messages and a compaction item. The complete output array is the continuation input. The local implementation's field is named encrypted_content for wire compatibility, but the content is plaintext; it is not interoperable with OpenAI's encrypted checkpoints. Keep that distinction in a short note, then focus on the engineering question: what must survive for the next code change to remain correct? The two aligned plots are illustrative: active context rises to a trigger, then drops at compaction; task fidelity may recover if the checkpoint preserves constraints or decline if it loses them. There is no universal relationship or measured curve implied.", "command": "", "cue": "Do not treat a shorter summary as proof of success.", "sources": ["compact", "openai_compact"], "original_slide": 18}, {"title": "What can this agent afford to forget?", "start": 36, "end": 37, "layout": "question", "text": ["Preserve: task, constraints, decisions, unfinished work", "Retrieve again: source documents and current policy", "Compress: duplicate logs and intermediate narration"], "notes": "Give the room 20 seconds to name the minimum checkpoint for our task. Reveal the answer after they respond: work item DEMO-742, the public signature, no new dependencies, no test edits, 12-second cap, zero semantics, and whether the code has been changed. Explain that some evidence may be better re-fetched than copied into permanent memory. The output should distinguish an observed test result from an intention to run tests. This is the quality test for compaction: can the next action obey the same constraints? A byte reduction alone does not answer that. The next demo uses a seeded teaching transcript so every rehearsal begins with the same known facts.", "command": "", "cue": "Audience predicts the compaction acceptance criteria.", "sources": [], "original_slide": 19}, {"title": "Compact the history. Continue from the checkpoint.", "start": 37, "end": 41, "layout": "api_walk", "text": ["DEMO 4 / Context under a budget", "Inspect the returned window", "Ask a follow-up that depends on old facts"], "notes": "Validation artifacts: captures/slide19-validation/. The exact curl → jq → curl flow passed using a real stored response ID; it preserved DEMO-742, no new dependencies, and no test edits. This ID belongs to an isolated local validation database and must be replaced on another deployment. A separate full-history compaction test through OpenAI Python SDK 3.16.2 preserved ticket, cap=12 seconds, zero means retry immediately, standard-library restriction, and no code changed yet. SDK typed serialization emitted warnings for retained user input_text messages; raw curl/jq preserved the returned output unchanged and succeeded. These are real local Agentic API/vLLM results, not hosted OpenAI results. No fixed compression ratio or universal memory fidelity is claimed.", "command": "", "cue": "Hard stop at 41:00; report actual preservation.", "sources": ["compact"], "original_slide": 20, "steps": [{"label": "1. Compact", "body": "Compact a real stored response from the task introduced on slide 11. This ID comes from our local validation run; use first.id from your own session.", "code": "curl http://localhost:9000/v1/responses/compact \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n  \"model\": \"nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-BF16\",\n  \"previous_response_id\": \"resp_01a1ad7b-faa4-79a2-821a-fde72632c32c\"\n}' > compact.json"}, {"label": "2. Build the next input", "body": "Use the entire returned output array—not just the summary text. Append your next user message.", "code": "jq '{\n  model: \"nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-BF16\",\n  input: (.output + [{\n    role: \"user\",\n    content: \"Continue the fix. Repeat the constraints first.\"\n  }])\n}' compact.json > continue.json"}, {"label": "3. Continue", "body": "The new inference round receives the compacted window and the new input.", "code": "curl http://localhost:9000/v1/responses \\\n  -H 'Content-Type: application/json' \\\n  --data-binary @continue.json"}, {"label": "4. Captured result", "body": "Actual local API result: the ticket and both supplied constraints survived. This response did not execute a code edit.", "code": "# Captured continuation output (excerpt)\nConstraints:\n1. Fix retry_delay (Jira ticket DEMO-742).\n2. No new dependencies.\n3. Do not edit tests.\n\n# Compaction output item types\n[\"message\", \"compaction\"]"}], "scope": "Live-validated 2026-11-05 · Agentic API + local Nemotron 3.5 Bolt E4B / vLLM · not a hosted OpenAI test.", "capture_excerpt": [{"number": "1–5", "text": "{\n  \"id\": \"resp_01a1ad7c-7358-7db2-84ab-e40e78b7163d\",\n  \"object\": \"response.compaction\","}, {"number": "6–14", "text": "  \"output\": [\n    { \"type\": \"message\", \"role\": \"user\",\n      \"content\": [{ \"type\": \"input_text\","}, {"number": "15–18", "text": "        \"text\": \"Jira ticket DEMO-742: fix retry_delay. No new dependencies. Do not edit tests. Acknowledge these constraints.\"\n      }]\n    },"}, {"number": "19–23", "text": "    { \"type\": \"compaction\", \"id\": \"cmp_01a1ad7c-855e-7b22-b4ad-487869af49e1\",\n      \"encrypted_content\": \"**Context Checkpoint:** Working on Jira ticket DEMO-742 … **References:** DEMO-742.\"\n    }"}, {"number": "24–38", "text": "  ],\n  \"usage\": { \"input_tokens\": 174, \"output_tokens\": 68, \"total_tokens\": 242, … }\n}"}]}, {"title": "The task survived compaction.", "start": 41, "end": 43, "layout": "checkpoint_check", "text": ["Jira ticket: DEMO-742", "Retry cap: 12 seconds", "Retry-After: 0 means zero", "No dependencies; no test edits", "The fix is not yet complete"], "notes": "This slide reports real local validation, not a hypothetical failure. The stored-ID curl/jq run in the stored-ID compaction run retained DEMO-742, no new dependencies, and no test edits. The separate full-history SDK run also retained the 12-second retry cap, zero means retry immediately, standard-library-only restriction, and no code changed yet. The model stated the next action was implementing retry_delay; it did not edit files or run tests. Do not claim a completed code fix or a general fidelity benchmark. Captures are in captures/slide19-validation/.", "command": "", "cue": "Compaction preserved context; implementation remains the next task.", "sources": ["compact"], "original_slide": 21}, {"title": "From one machine to a Kubernetes fleet.", "start": 43, "end": 46, "layout": "deployment", "text": ["CPU pool: hydrate item history and execute supported tools", "GPU pools: inference, with optional prefill/decode disaggregation", "Kubernetes: scale each workload independently"], "notes": "The point is independently scalable workloads, not a taxonomy of engines. In this gateway deployment, CPU-only Agentic API replicas hydrate item history from shared PostgreSQL, orchestrate inference rounds, and execute supported built-in tools or call external tool services. Kubernetes deploys separate CPU and GPU worker pools; it does not automatically choose the right scaling policy. llm-d routes model requests by load and cache locality. In a configured vLLM disaggregated deployment, GPU prefill workers compute the prompt KV cache and transfer it to GPU decode workers. Prefill/decode disaggregation is distinct from separating CPU orchestration from GPU inference. Gateway execution here does not include every tool: client-executed functions remain with the client. Agentic API has vLLM and SGLang upstream integration paths, plus llm-d and Dynamo serving integrations; each has its own capabilities. The linked llm-d Responses guide validates vLLM specifically, not every engine/topology combination. This is an architecture illustration, not a newly benchmarked cluster. Use the five-step interactive Kubernetes fleet graphic: connect, hydrate, route, tool loop, and disaggregate. On the final step, the GPU worker fleet becomes separate prefill and decode pools with KV cache transfer. The ordinary Kubernetes deployment uses stateless gateway replicas with shared PostgreSQL. Agentic API owns saved response history and gateway-executed tools; llm-d owns model-server selection using load and estimated prefix-cache reuse. Separate namespaces and service boundaries allow the gateway and inference fleet to scale independently. The drawing illustrates request placement, not transparent recovery of an in-flight stream or exactly-once tool execution. Then compare the local and remote-harness paths in the footer. The first is the local inference setup; the second keeps the agent-facing gateway and moves inference behind an llm-d or Dynamo serving endpoint. The third moves the harness workspace itself onto a remote machine. These are independent axes. Show the attach command with a prepared cluster gateway URL only if that environment has been rehearsed. Otherwise use this labeled deployment walkthrough and the actual integration documentation. Do not provision Kubernetes, load a new model, or migrate a live session on stage. The separate agentic-llm-d hydrate/persist service is an alpha integration with narrower feature support; it is not the default route for our compaction or MCP demonstrations. Use the ordinary gateway-to-router topology for that combined workflow. A real local Kubernetes recording is now available via the Recorded deployment tab or D. The deployment has two CPU-only Agentic API pods sharing PostgreSQL, the official llm-d standalone router (EPP + Envoy), and one connector pod bridging to the existing Spark vLLM. The recording verifies a function-call response on one gateway pod and continuation on another using the stored response ID. This proves the demonstrated shared-state route, not multi-GPU scaling, disaggregation, automatic failover, or measured cache-aware balancing. The diagram continues to illustrate the larger fleet architecture. The local deployment uses a development build with the startup file-search registration fix. The following dedicated slide opens the prefill/decode dataflow; spend at most three minutes here including the short Kubernetes recording.", "command": "", "cue": "Cycle with ]: connect → hydrate → route → tool loop → disaggregate. CPU and GPU workloads scale independently.", "sources": ["cluster", "llmd_responses", "llmd_disagg", "vllm_disagg", "sglang", "dynamo", "llmd"], "original_slide": 23}, {"title": "Prefill here. Decode there.", "start": 46, "end": 48, "layout": "disagg", "text": [], "notes": "Interactive, simplified llm-d + vLLM disaggregated inference walkthrough, not a real multi-worker capture. Start paused; P plays or pauses; [ and ] step. A configured llm-d EPP selects a decode endpoint, checks its cached prefix, and selects a prefill endpoint when the uncached suffix warrants disaggregation. The decode-side routing proxy coordinates prefill and the subsequent decode request. Both roles are vLLM model workers with model weights. Prefill computes prompt attention state; a configured KV connector transfers that state to decode. The decode worker generates the continuation and streams output through Agentic API to the harness. Tool execution remains with the appropriate client or gateway executor. The next inference round includes its output and may reuse cached prefixes where available. Durable conversation state is distinct from transient inference KV cache. The illustration omits connector-specific RPC and metadata details. NIXL/RDMA is one configured path, not a property automatically enabled by deploying Agentic API. Explain the value as isolating long prefills from decode and tuning TTFT and inter-token latency independently; KV transfer and scheduling overhead matter, so this is not a blanket throughput or cost improvement. The preceding actual kind recording bridges to only one Spark GPU and cannot demonstrate this transfer.", "command": "", "cue": "P starts the walkthrough. Route → prefill → transfer KV → decode → tool output → next inference round.", "sources": ["vllm_disagg", "llmd_pd_flow"]}, {"title": "The harness is solved. What comes next?\nSwarms", "start": 48, "end": 49, "layout": "swarm_tree", "text": [], "notes": "Frame this as our next engineering direction: the local harness and open inference path now work for the workflows demonstrated here. One local harness becomes the orchestrator, delegating competing approaches to cloud agents, tracking progress, cancelling weak branches, and selecting verified results. This is not a claim that all local-harness problems are solved. Research direction, not a shipped swarm feature. Start with the retained conversation: repository discoveries, constraints, tool results, and the current hypothesis. Fork that checkpoint into independent continuations that explore different fixes. Each branch needs its own item history and isolated workspace snapshot; retaining a conversation does not snapshot files or undo external effects. Test each candidate, stop weak branches, and continue a promising result. Share verified artifacts and findings with provenance rather than merging every transcript. Replay the animation to show the common trunk, fan-out, and selection.\nOur proposed work is to make forks, workspace ownership, budgets, cancellation, and evaluation explicit at the agentic-server boundary. Possible behaviors include agents specializing, several agents rediscovering the same fix, or a shared mistaken assumption causing correlated failures. Diversity of approach and independent evaluation matter more than agent count. This is the essay's central question made concrete: can we inspect and change the machinery that coordinates the agents? Transition: a branch of conversation alone cannot run code. Each cloud agent needs files, dependencies, and skills inside an execution environment.", "command": "", "cue": "One checkpoint. Many hypotheses. Evidence chooses what continues.", "sources": ["agentic_essay", "repo"], "original_slide": 28}, {"title": "What does it take to equip 10,000 agents?", "start": 49, "end": 51, "layout": "skill_execution", "text": [], "notes": "The local harness requests and steers work through Agentic API. Agentic API owns spawning, scheduling, tracking, and cancelling cloud agents; response_id or conversation_id references retained context at this boundary. An identifier does not itself clone a workspace or create an independent branch; branch and environment lifecycle are proposed server responsibilities. The proposed Containers API lifecycle provisions a separate workspace for each branch. The Skills API supplies versioned instructions, scripts, and assets that are mounted into those containers alongside the repository, data, and dependencies. The cloud agent uses shell execution in its environment and returns patches and test evidence to the orchestrator. Skills must be available where execution happens, not just mentioned in a prompt. Show the same container contract repeated for competing approaches. Inference can remain in the separate GPU pool. This is a proposed open-stack integration, not a claim that all lifecycle or swarm APIs are shipped. Scale reference: OpenAI reported on the order of 10,000 concurrent agents in its Navier–Stokes effort (September 8, 2026), with communicating groups and Codex consolidating useful intermediate insights. This is not a claim that Agentic API has demonstrated 10,000-agent operation, or that OpenAI used the Containers API and Skills API architecture drawn here. The illustration presents our proposed infrastructure for equipping and orchestrating a fleet.", "command": "", "cue": "Local harness → agentic server → cloud agents. Each container gets files + dependencies + skills.", "sources": ["skills_api", "shell_api", "shell_local", "openai_swarm"], "original_slide": 25}, {"title": "Spawn. Execute. Coordinate.", "start": 51, "end": 53, "layout": "environment_lifecycle", "text": [], "notes": "Continue the exact architecture from the preceding slide: the orchestrator forks the retained task into three cloud agents with independent containers. Each gets the same repository revision and pinned skill version, but a different hypothesis. Provision through the proposed Containers API lifecycle, stage files and mount skills, run the skill scripts through shell, then return patches and test reports. Select a verified result and stop the remaining branches. Preserve useful artifacts before releasing containers. Conversation state and filesystem state are separate; retaining an item history cannot restore a deleted workspace. A container alone is not a complete sandbox policy: define mounts, network access, credentials, resource limits, budgets, and cancellation. Proposed swarm orchestration, not a shipped end-to-end demo. Coordination is ongoing, not just final selection: the diagram shows A sharing a failed attempt and its test evidence through Agentic API. B and C incorporate that specific constraint while continuing independent work. Share evidence with scope and provenance; a failed implementation does not invalidate a whole approach.", "command": "", "cue": "Each branch needs its own files and skills. The orchestrator collects evidence, not just answers.", "sources": ["skills_api", "shell_api"], "original_slide": 26}, {"title": "Branch the work. Reuse the prefix.", "start": 53, "end": 53.5, "layout": "swarm_cost", "text": ["One shared prefix", "Independent continuations", "Reuse cached KV blocks", "Sync failures with evidence"], "notes": "Start at the gold trunk: task, instructions, and retained work form a shared token prefix. Branch-specific instructions come after that prefix. The blue paths are independently generated continuations. With matching cached KV blocks available to each request, the engine avoids recomputing shared-prefix prefill. The N-to-1 comparison is idealized accounting for the shared prefix only: initial population plus full hits on later branches. Concurrent cold misses, eviction, routing, and incompatible settings can reduce reuse. Every branch still pays for its unique prefill, decoding, and tools. Retaining conversation history is separate from caching KV blocks. Syncing failed attempts with evidence can also avoid duplicated investigation, but this is a proposed coordination benefit and has token and latency costs. No measured swarm speedup or total-cost reduction is claimed.", "command": "", "cue": "More verified solutions per dollar—not just more branches.", "sources": ["prefix_cache"], "original_slide": 29}, {"title": "Own the inference.\nBuild the swarm.", "start": 53.5, "end": 54, "layout": "closing", "text": ["Fork from retained work", "Give each branch a workspace and budget", "Promote evidence, prune dead ends", "Make the machinery open—and measurable"], "notes": "We started with one familiar harness using open inference. The next experiment is a server that can retain the work, branch it into competing approaches, and show why a result won. This is a direction we want to build toward in Agentic API, not a commitment to a shipped feature or an announced delivery date. Close: 'If swarms are going to work while we sleep, we should be able to inspect what they did, change how they coordinate, and own the infrastructure they run on.' Invite people to help build and measure it. Begin Q&A at minute 54.", "command": "", "cue": "Help us build the machinery, then test the hypothesis.", "sources": ["agentic_essay", "repo"], "original_slide": 30}, {"title": "Thank you.\nCome build the open agentic server with us.", "start": 54, "end": 60, "layout": "thank_you", "text": ["Bring an integration, a failing workflow, or an experiment.", "AI is too important to be opaque. Build it in the open.", "github.com/vllm-project/agentic-api", "slack.vllm.ai/"], "notes": "Thank the audience explicitly, invite contributions and questions. Link the repository, Slack invite, and published slides. Close with: AI is too important to be opaque. Build it in the open. Reserve six minutes for Q&A. The QR code must point to the agreed public slide URL, not localhost.", "command": "", "cue": "Do not let an appendix consume the Q&A reserve.", "sources": ["tools", "compact", "repo"], "original_slide": 31}, {"title": "Attach to a prepared gateway", "start": null, "end": null, "layout": "code", "text": ["APPENDIX / Exact launch pattern", "AIE_GATEWAY_URL is the origin, without /v1.", "AIE_MODEL must match /v1/models exactly."], "notes": "Use this slide if someone asks how to connect. The agentic harness command attaches to an existing gateway. The agentic run command starts a local gateway against an upstream. Those are different roles; do not pass the gateway URL as the upstream URL. The CLI creates isolated harness configuration. Use AGENTIC_GATEWAY_API_KEY when the gateway requires authentication and do not display its value. Pin and rehearse the actual harness versions. The repository's current guide records Claude Code 2.1.245 and Codex 0.149.1 for its CLI replay checks; that is evidence for those tests, not a mandate to install those versions during the workshop. Keep default approval behavior. No attendee needs to execute these commands during the session.", "command": "agentic harness codex \\\n  --gateway-url \"$AIE_GATEWAY_URL\" --model \"$AIE_MODEL\"\n\nagentic harness claude \\\n  --gateway-url \"$AIE_GATEWAY_URL\" --model \"$AIE_MODEL\"", "cue": "", "sources": ["harness"], "original_slide": 32}], "sources": {"openai_retrieval": "https://developers.openai.com/api/docs/guides/retrieval", "anthropic_compact": "https://platform.claude.com/docs/en/build-with-claude/compaction", "anthropic_search": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool", "anthropic_memory": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool", "proposal": "https://docs.google.com/document/d/1A4sp3n44uAly3EEqbp8vnwmK7CaHw42eUq4tijx4fUg/edit", "harness": "https://github.com/vllm-project/agentic-api/blob/092b82cb4e3ea74142e4f836a5957fbe4f305f28/docs/guides/harness-cli-testing.md", "compact": "https://github.com/vllm-project/agentic-api/blob/092b82cb4e3ea74142e4f836a5957fbe4f305f28/docs/guides/responses-compaction.md", "tools": "https://github.com/vllm-project/agentic-api/blob/092b82cb4e3ea74142e4f836a5957fbe4f305f28/crates/agentic-server-core/src/tool/normalize.rs", "mcp": "https://github.com/vllm-project/agentic-api/blob/092b82cb4e3ea74142e4f836a5957fbe4f305f28/docs/design/mcp-gateway-integration.md", "llmd": "https://github.com/vllm-project/agentic-api/blob/092b82cb4e3ea74142e4f836a5957fbe4f305f28/docs/design/agentic-llm-d.md", "cluster": "https://github.com/vllm-project/agentic-api/blob/092b82cb4e3ea74142e4f836a5957fbe4f305f28/docs/deploying/kubernetes.md", "sglang": "https://github.com/vllm-project/agentic-api/blob/092b82cb4e3ea74142e4f836a5957fbe4f305f28/docs/guides/sglang-upstream.md", "dynamo": "https://github.com/vllm-project/agentic-api/blob/092b82cb4e3ea74142e4f836a5957fbe4f305f28/docs/guides/dynamo-upstream.md", "cloud": "https://learn.chatgpt.com/docs/environments/cloud-environments", "file_search": "https://developers.openai.com/api/docs/guides/tools-file-search", "retrieval_benchmark": "https://franciscojavierarceo.dev/presentations/keep-the-harness-own-your-inference/captures/retrieval-benchmark/methodology.json", "openai_compact": "https://developers.openai.com/api/docs/guides/compaction", "skills_create": "https://developers.openai.com/api/reference/resources/skills/methods/create", "container_files": "https://developers.openai.com/api/reference/resources/containers/subresources/files/methods/create", "skills_api": "https://developers.openai.com/api/docs/guides/tools-skills", "shell_api": "https://developers.openai.com/api/docs/guides/tools-shell", "shell_local": "https://github.com/vllm-project/agentic-api/blob/a38b0f0cbafb02b969da1c2724308bf23d375a8d/docs/design/shell-tool.md", "shell_handler": "https://github.com/vllm-project/agentic-api/blob/a38b0f0cbafb02b969da1c2724308bf23d375a8d/crates/agentic-server-core/src/tool/shell.rs", "responses_migration": "https://developers.openai.com/api/docs/guides/migrate-to-responses", "anthropic_threads": "https://platform.claude.com/docs/en/build-with-claude/message-threads", "threads_announcement": "https://claude.com/resources/articles/message-threads", "agentic_essay": "https://chatgpt.com/space/page_ba99c98061b08191a2520014ae39a723", "prefix_cache": "https://docs.vllm.ai/en/latest/features/automatic_prefix_caching/", "spec_decode": "https://docs.vllm.ai/en/latest/features/speculative_decoding/", "repo": "https://github.com/vllm-project/agentic-api", "llmd_responses": "https://llm-d.ai/docs/well-lit-paths/foundations/serve-responses-api", "llmd_disagg": "https://llm-d.ai/docs/architecture/disaggregation", "vllm_disagg": "https://docs.vllm.ai/en/latest/features/disagg_prefill/", "openai_swarm": "https://openai.com/index/navier-stokes-solution/", "llmd_pd_flow": "https://llm-d.ai/docs/architecture/disaggregation/pd-disaggregation", "openai_function_flow": "https://developers.openai.com/api/docs/guides/function-calling", "openai_history": "https://developers.openai.com/api/docs/guides/conversation-state", "openai_prompt_cache": "https://developers.openai.com/api/docs/guides/prompt-caching"}}</script>
<script>
'use strict';
const {slides,sources}=JSON.parse(document.getElementById('deck-data').textContent);
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let index=0,route='overview',step=0;
let motionFrame=0,motionElapsed=0,motionLast=0,motionPlaying=false,motionSequence=[],motionStage=-1;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
// Deform the fabric itself: wind travels from the fixed hoist to the loose fly edge.
let freedomFrame=0,freedomStart=0,freedomSurface=null;
function pauseFreedomFlag(){if(freedomFrame)cancelAnimationFrame(freedomFrame);freedomFrame=0;}
function flagSurface(){
 if(freedomSurface)return freedomSurface;
 const c=document.createElement('canvas');c.width=1900;c.height=1000;const g=c.getContext('2d');
 g.fillStyle='#fff';g.fillRect(0,0,1900,1000);g.fillStyle='#b22234';
 for(let i=0;i<13;i+=2)g.fillRect(0,i*1000/13,1900,1000/13);
 g.fillStyle='#234b93';g.fillRect(0,0,760,7000/13);g.fillStyle='#fff';
 for(let row=0;row<9;row++)for(let col=0;col<(row%2?5:6);col++){
  const x=(col+(row%2?1:.5))*760/6,y=(row+1)*700/13;
  g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?11.76:30.8;const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;if(i)g.lineTo(px,py);else g.moveTo(px,py);}g.closePath();g.fill();
 }
 freedomSurface=c;return c;
}
function drawFreedomFlag(now){
 freedomFrame=0;const canvas=$('freedom-cloth');if(!canvas)return;
 if(!freedomStart)freedomStart=now;
 const t=reducedMotion.matches?1.15:(now-freedomStart)/3000,g=canvas.getContext('2d'),cloth=flagSurface();
 g.clearRect(0,0,2000,1260);
 const column=x=>{const u=x/1900,e=Math.pow(u,.78),phase=u*Math.PI*3.6-t*2.7;return {x:50+x+Math.sin(phase)*17*e,y:130+e*(100*Math.sin(phase)+25*Math.sin(u*Math.PI*2-t*1.8)),h:1000*(1-.055*e+.045*Math.cos(phase)*e),shade:Math.cos(phase-.8)};};
 for(let x=0;x<1900;x+=5){
  const a=column(x),b=column(Math.min(x+5,1900)),w=b.x-a.x+.6;
  g.drawImage(cloth,x,0,Math.min(5,1900-x),1000,a.x,a.y,w,a.h);
  if(a.shade<0){g.fillStyle=`rgba(0,0,0,${-a.shade*.46})`;g.fillRect(a.x,a.y,w,a.h);}
  else{g.fillStyle=`rgba(255,255,255,${a.shade*.16})`;g.fillRect(a.x,a.y,w,a.h);}
 }
 if(!reducedMotion.matches&&!document.hidden)freedomFrame=requestAnimationFrame(drawFreedomFlag);
}
function playFreedomFlag(){pauseFreedomFlag();freedomStart=0;if($('freedom-cloth'))drawFreedomFlag(performance.now());}
reducedMotion.addEventListener('change',()=>{if($('freedom-cloth'))playFreedomFlag();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseFreedomFlag();else if($('freedom-cloth'))playFreedomFlag();});

const paths={
 overview:{title:'The agentic server',body:'Codex connects to a system of APIs: inference, state, context management, tools, reusable skills, and execution environments.',nodes:['responses'],wires:[]},
 inference:{title:'Generate the next action',body:'Codex assembles the initial prompt, instructions, and tool declarations into a request. The Responses API calls the configured model backend. A model result may be text—or a tool call.',nodes:['prompts','client','responses','engine'],wires:['initial-prompt','request','generate']},
 state:{title:'Bring the conversation back',body:'The server restores earlier items, joins tool calls to their outputs, and prepares the context for the next inference round.',nodes:['responses','conversation'],wires:['state']},
 compact:{title:'Make room without losing the job',body:'Compaction uses inference to build a smaller context window. Preserve constraints, decisions, and unfinished work; then check the next action.',nodes:['responses','conversation','compact','engine'],wires:['state','compact','compact-model']},
 retrieval:{title:'Give the model evidence',body:'Files are processed into a searchable collection. Retrieval supplies relevant evidence to the tool loop. This is the broader architecture; file_search executes retrieval on the server.',nodes:['responses','files','processor','vector','search','tools'],wires:['files-process','process-vector','vector-search','search-tools','tools']},
 skills:{title:'Package the procedure',body:'The Skills API creates reusable bundles of instructions, scripts, and assets. Attach a chosen skill to the execution environment so the agent can read it and use its files.',nodes:['skills','containers','tools'],wires:['skills-container','container-tools']},
 containers:{title:'Give execution a workspace',body:'The Containers API manages runtime resources. Container files can be uploaded directly or created from an existing Files API file_id. Shell tools use the configured environment; the model backend remains separate.',nodes:['files','containers','tools','responses'],wires:['files-container','container-tools','tools']},
 tools:{title:'A tool call needs an executor',body:'The harness runs client function tools. The gateway can execute supported built-ins such as remote MCP. Tool results return to the next inference round.',nodes:['client','responses','tools'],wires:['request','tools']}
};
const tour=Object.keys(paths).filter(key=>key!=='overview');

function selectRoute(next){route=next;const p=paths[next];document.querySelectorAll('[data-route]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.route===next));document.querySelectorAll('[data-node]').forEach(n=>{n.classList.toggle('focus',p.nodes.includes(n.dataset.node));n.classList.toggle('hot',n.dataset.node==='responses')});document.querySelectorAll('[data-wire]').forEach(w=>w.classList.toggle('active',p.wires.includes(w.dataset.wire)));$('map-heading').textContent=p.title;$('map-body').textContent=p.body;$('map-step').textContent=next==='overview'?'OPEN THE HOOD':`REQUEST PATH / ${next.toUpperCase()}`;$('packets').replaceChildren();}
function pauseMotion(){cancelAnimationFrame(motionFrame);motionPlaying=false;document.querySelector('.map')?.classList.remove('running');if($('trace'))$('trace').textContent='▶ Play · P';}
function cycleRoute(delta){const routes=['overview',...tour];const next=routes[(routes.indexOf(route)+delta+routes.length)%routes.length];pauseMotion();motionElapsed=0;motionStage=-1;motionSequence=next==='overview'?tour:[next];selectRoute(next);if(next!=='overview')playMotion([next]);}
function drawPackets(local){const layer=$('packets');layer.replaceChildren();const wires=paths[route].wires;wires.forEach((key,i)=>{const progress=(local-600-i*850)/850;if(progress<0||progress>1.35)return;const path=$('wire-'+key);const length=path.getTotalLength();for(let tail=6;tail>=0;tail--){const t=progress-tail*.035;if(t<0||t>1)continue;const pt=path.getPointAtLength(length*t);const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);dot.setAttribute('r',tail===0?'6':String(4-tail*.4));dot.setAttribute('class',tail===0?'packet':'trail');dot.setAttribute('opacity',String(1-tail*.12));layer.append(dot);}});}
function motionTick(now){if(!motionPlaying||!$('packets'))return;if(motionLast)motionElapsed+=Math.min(now-motionLast,100);motionLast=now;let elapsed=motionElapsed,stage=0;while(stage<motionSequence.length){const duration=paths[motionSequence[stage]].wires.length*850+2300;if(elapsed<duration)break;elapsed-=duration;stage++;}if(stage>=motionSequence.length){pauseMotion();$('packets').replaceChildren();$('trace').textContent='▶ Play · P';motionStage=-1;motionElapsed=0;return;}if(stage!==motionStage){motionStage=stage;selectRoute(motionSequence[stage]);$('map-step').textContent=`${String(stage+1).padStart(2,'0')} / ${motionSequence.length} · ${route.toUpperCase()}`;}drawPackets(elapsed);motionFrame=requestAnimationFrame(motionTick);}
function playMotion(sequence=null){if(sequence){pauseMotion();motionSequence=sequence;motionElapsed=0;motionStage=-1;}if(!motionSequence.length)motionSequence=tour;if(reducedMotion.matches){selectRoute(motionSequence[0]);$('trace').textContent='Reduced motion';return;}motionPlaying=true;motionLast=0;document.querySelector('.map').classList.add('running');$('trace').textContent='Ⅱ Pause · P';motionFrame=requestAnimationFrame(motionTick);}
reducedMotion.addEventListener('change',()=>{if(reducedMotion.matches){pauseMotion();$('packets')?.replaceChildren();}});

const loopStages=[
 {label:'Hydrate',owner:'AGENTIC SERVER',title:'An ID becomes model context.',body:'Codex sends a new input and a saved response ID. The server loads the earlier items, then adds the new input and current instructions/tools.',code:`// Incoming request (selected fields)
{ "previous_response_id": "resp_01",
  "input": "Fix retry_delay. Read policy.txt first." }

[earlier user: "No new dependencies. Do not edit tests.",

+ current instructions + tool definitions`,take:'Hydration reconstructs input. It does not restore model weights or a filesystem.'},
 {label:'Generate',owner:'INFERENCE ENGINE + MODEL',title:'The model generates tokens.',body:'The engine processes the assembled context and samples successive tokens. A tool-capable model can generate a structured action instead of prose.',code:`Prefill: tokenize and process the assembled context

Retry-After accepts non-negative decimal seconds.

exit code: 0

 {label:'Return output',owner:'CODEX → AGENTIC SERVER',title:'Return evidence with the same call_id.',body:'Codex sends the command output back. The server joins it to the saved call and prepares another inference round.',code:`// Next request (selected fields)

  }]
}

resp_02 contains the function call from round one.`,take:'previous_response_id finds the history; call_id identifies which action this output answers.'},

  “Preserve zero; clamp valid delays to 12 seconds.
   Inspect retry_client.py before editing.”

Next: another tool call → Codex executes → output
Repeat until the agent answers or the task stops.`,take:'The agent loop is repeated inference plus execution plus context assembly.'}
];

function highlightCode(code){const re=/(\/\/[^\n]*|#[^\n]*|"(?:\\.|[^"\\])*"|'[^']*'|\b(?:true|false|null|\d+)\b)/g;let result='',last=0;for(const m of code.matchAll(re)){result+=esc(code.slice(last,m.index));const t=m[0];const key=t.startsWith('"')&&/^\s*:/.test(code.slice(m.index+t.length));result+=`<span class="${t.startsWith('//')||t.startsWith('#')?'syn-comment':key?'syn-key':t.startsWith('"')||t.startsWith("'")?'syn-string':'syn-value'}">${esc(t)}</span>`;last=m.index+t.length;}return result+esc(code.slice(last));}
