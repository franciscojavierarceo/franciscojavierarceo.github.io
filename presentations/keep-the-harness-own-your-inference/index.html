function compactExcerptHTML(s){return `<section class="capture-excerpt" aria-label="Captured compact.json excerpt"><div class="capture-caption">compact.json · captured output <span>Source line ranges · selected fields; long text shortened</span></div><div class="capture-lines">${s.capture_excerpt.map(line=>`<div class="capture-line"><span class="line-number">${esc(line.number)}</span><code>${highlightCode(line.text)}</code></div>`).join('')}</div></section>`;}
function showAPI(i){const t=slides[index].steps[i];apiStep=i;const benchmark=t.kind==='retrieval_benchmark';$('slide').querySelector('h2').textContent=benchmark?'Open retrieval. Measured.':slides[index].title;$('api-example').hidden=benchmark;$('api-benchmark').hidden=!benchmark;$('api-scope').textContent=benchmark?'Nov 3, 2026 · semantic retrieval · nomic-embed-text-v1.5 · same embeddings. Separate from the keyword PDF demo; retrieval quality only.':slides[index].scope;$('api-label').textContent=t.label;$('api-body').textContent=t.body;$('api-code').innerHTML=highlightCode(t.code);document.querySelectorAll('[data-api]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.api)===i));}
function protocolHTML(){return `<div class="protocol-grid"><article><h3>OpenAI-compatible</h3><pre class="api-code">${highlightCode('POST /v1/responses\n{\n  "model": "served-model",\n  "input": "Fix the failing test.",\n  "store": true\n}')}</pre></article><article><h3>Anthropic-compatible</h3><pre class="api-code">${highlightCode('POST /v1/messages\n{\n  "model": "served-model",\n  "max_tokens": 1024,\n  "messages": [{ "role": "user",\n    "content": "Fix the failing test." }]\n}')}</pre></article></div><div class="bridge-core"><h3>↓ vLLM Agentic API ↓</h3><p>Protocol adaptation · conversation state · tool orchestration</p></div><p class="subtitle" style="text-align:center">Your inference endpoint: vLLM / SGLang / llm-d / Dynamo</p><p class="scope">One server accepts both protocol families. Contracts and supported features differ; this is not blanket API parity.</p>`;}
function curveHTML(){return `<p class="eyebrow gold">ILLUSTRATIVE · CONTEXT PRESSURE AND TASK FIDELITY OVER AN AGENT SESSION</p><svg class="curve-map" viewBox="0 0 1100 360" role="img" aria-label="Illustrative active context rises to a compaction trigger and falls twice. Task fidelity can remain high with a good checkpoint or fall if facts are lost."><text class="chart-label" x="15" y="35">Active context</text><path class="gridline" d="M200 25V170H1060M200 210V330H1060"/><path stroke="#77808c" stroke-dasharray="5 5" d="M200 55H1060"/><text x="810" y="45">Compaction trigger</text><path class="context-line" d="M210 150L330 110L440 55L445 145L570 100L690 55L695 143L840 96L1010 58"/><path stroke="#586778" stroke-dasharray="4 6" d="M440 55V330M690 55V330"/><text x="395" y="194">compact</text><text x="650" y="194">compact</text><text class="chart-label" x="15" y="238">Task fidelity</text><text x="15" y="262">on a fixed check</text><path class="quality-line" d="M210 235L330 235L440 250L480 235L600 237L690 252L730 235L1010 237"/><path class="loss-line" d="M440 250L480 286L690 286L730 310L1010 310"/><text x="880" y="350">Agent steps →</text></svg><p class="chart-legend"><span style="color:var(--blue)">Blue: active context</span> · <span style="color:var(--gold)">Gold: essentials preserved</span> · <span style="color:#e77c8b">Pink: constraints lost</span></p><p class="subtitle">A smaller context only helps if the next action is still correct.</p><p class="scope">Conceptual trajectories, not measurements or a universal performance law. Compaction can preserve, improve, or damage downstream performance.</p>`;}

function rows(vals){return `<div class="rows">${vals.map((v,j)=>`<div class="row"><span class="number">${String(j+1).padStart(2,'0')}</span><span>${esc(v)}</span></div>`).join('')}</div>`}
function cards(vals){return `<div class="grid" style="--cols:${vals.length===4?2:Math.min(vals.length,3)}">${vals.map((v,j)=>{const [h,...b]=v.split('\n');return `<article class="tile"><div class="index">${String(j+1).padStart(2,'0')}</div><h3>${esc(h)}</h3>${b.length?`<p>${esc(b.join('\n'))}</p>`:''}</article>`}).join('')}</div>`}

let disaggStep=0,disaggTimer=null;
const disaggStages=[
 ['Route the inference round','Agentic API supplies the assembled context. llm-d selects a decode worker and, when the uncached prompt warrants it, a prefill worker.'],
 ['Prefill the prompt','The prefill GPU runs the model over the prompt and computes its key/value cache. It is a model worker, not a tokenizer service.'],
 ['Move the KV cache','The serving stack transfers attention state from the prefill GPU to the decode GPU. This is transient inference state, separate from saved conversation history.'],
 ['Decode the continuation','The decode GPU generates the continuation using that cache. The serving stack streams output back through Agentic API to the harness.'],

else if(s.layout==='why_open')body+=`<p class="why-thesis">The layer is opaque today.<br><span>It’s where agent research is heading.</span></p><div class="why-boundary"><span class="why-end">HARNESS</span><span class="why-arrow" aria-hidden="true">→</span><div class="why-middle"><b>THE MACHINERY BETWEEN</b><span>State · tools · execution · recovery</span></div><span class="why-arrow" aria-hidden="true">→</span><span class="why-end">INFERENCE</span></div><div class="why-reasons"><article><span>01 / UNDERSTAND</span><h3>Trace the work</h3><p>Which context? Which model? Which tools? What changed?</p></article><article><span>02 / CONTROL</span><h3>Enforce the limits</h3><p>Files, credentials, network access, time, and compute.</p></article><article><span>03 / EXPERIMENT</span><h3>Change the machinery</h3><p>Investigate failures. Test new behavior. Run the experiment yourself.</p></article><article><span>04 / LOOK AHEAD</span><h3>Understand the future</h3><p>Study new ideas in coordination, memory, and execution. We need machinery we can inspect and experiment with.</p></article></div><p class="why-close">An open interface lets us call it. Open code lets us inspect and change it.</p>`;

document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea')||$('notes-dialog').open)return;if(e.target.matches('video')&&!['p','P','v','V'].includes(e.key))return;if(slides[index].layout==='motivation'&&['[',']'].includes(e.key)&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();showOpening(openingStep+(e.key===']'?1:-1));return;}if(slides[index].layout==='disagg'&&['[',']','p','P'].includes(e.key)&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();if(e.key==='['||e.key===']')showDisagg(disaggStep+(e.key===']'?1:-1));else toggleDisagg();return;}if(slides[index].layout==='trace_recordings'&&['[',']','p','P','v','V'].includes(e.key)&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();if(e.key.toLowerCase()==='v'){expandTraceVideo();return;}if(e.key==='['||e.key===']')showTraceDemo(traceDemoStep+(e.key===']'?1:-1));else toggleTracePlayer();return;}if(slides[index].layout==='deployment'&&e.key.toLowerCase()==='p'&&!$('fleet-recording').hidden&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();const v=$('fleet-recording').querySelector('video');if(v.paused)v.play();else v.pause();return;}if(slides[index].layout==='deployment'&&e.key.toLowerCase()==='d'&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();setFleetRecording($('fleet-recording').hidden);return;}if(['[',']'].includes(e.key)&&slides[index].layout==='question'&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();const reveal=e.key===']';if($('audience-answer').hidden===reveal)$('reveal-answer').click();return;}if(['[',']'].includes(e.key)&&['stack','api_walk','loop_trace','deployment','environment_lifecycle'].includes(slides[index].layout)&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();const delta=e.key===']'?1:-1;const layout=slides[index].layout;if(layout==='stack')cycleRoute(delta);else if(layout==='environment_lifecycle')showLifecycle((lifecycleStep+delta+lifecycleStages.length)%lifecycleStages.length);else if(layout==='deployment')showFleet((fleetStep+delta+fleetStages.length)%fleetStages.length);else if(layout==='api_walk'){const count=slides[index].steps.length;showAPI((apiStep+delta+count)%count);}else showLoop((loopStep+delta+loopStages.length)%loopStages.length);return;}if(e.key.toLowerCase()==='p'&&slides[index].layout==='stack'&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();$('trace').click();return;}if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();move(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}if(e.key.toLowerCase()==='n')notes();if(e.key.toLowerCase()==='f')full();if(e.key==='Home'){index=0;render()}if(e.key==='End'){index=slides.length-1;render()}});
